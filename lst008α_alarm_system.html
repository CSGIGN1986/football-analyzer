<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LST008α 报警查询系统</title>
<style>
:root{--bg:#f0f2f5;--card:#fff;--primary:#1a73e8;--warn:#e37400;--stop:#c5221f;--text:#202124;--sub:#5f6368;--border:#dadce0;--hover:#e8f0fe;--shadow:0 1px 3px rgba(0,0,0,.12)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei","SimHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-user-select:none;user-select:none}
.header{background:linear-gradient(135deg,#1a237e,#0d47a1);color:#fff;padding:14px 16px;text-align:center;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.header h1{font-size:clamp(16px,4vw,22px);margin:0}
.container{max-width:1100px;margin:0 auto;padding:12px}
.tabs{display:flex;margin-bottom:14px;background:var(--card);border-radius:10px;overflow:hidden;box-shadow:var(--shadow);flex-wrap:wrap}
.tab{flex:1;min-width:100px;padding:12px 8px;text-align:center;cursor:pointer;border:none;background:transparent;font-size:14px;font-weight:600;color:var(--sub);transition:.2s;border-bottom:3px solid transparent;font-family:inherit}
.tab:hover{background:var(--hover);color:var(--primary)}
.tab.active{color:var(--primary);border-bottom-color:var(--primary);background:#e8f0fe}
.panel{display:none}.panel.active{display:block}
.search-bar{background:var(--card);padding:16px;border-radius:10px;box-shadow:var(--shadow);margin-bottom:12px}
.search-row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.search-row label{font-size:13px;font-weight:600;color:var(--sub);display:block;margin-bottom:4px}
.search-row input,.search-row select{padding:10px 14px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;flex:1;min-width:140px;font-family:inherit;background:#fff}
.search-row input:focus,.search-row select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(26,115,232,.15)}
.search-row button{padding:10px 24px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:.2s;font-family:inherit}
.btn-reset{background:#fff;color:var(--sub);border:1.5px solid var(--border)}.btn-reset:hover{background:var(--hover)}
.result-count{font-size:13px;color:var(--sub);margin:8px 0}.results{display:grid;gap:10px}
.card{background:var(--card);border-radius:10px;padding:14px;box-shadow:var(--shadow);border-left:5px solid var(--primary)}
.card.warn{border-left-color:var(--warn)}.card.stop{border-left-color:var(--stop)}
.card .card-header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.card .code-badge{background:var(--primary);color:#fff;padding:3px 10px;border-radius:4px;font-size:12px;font-weight:700;font-family:monospace}
.card .code-badge.sub{background:#6c5ce7}
.card .level-badge{padding:3px 10px;border-radius:4px;font-size:12px;font-weight:700}
.level-警告{background:#fef7e0;color:var(--warn)}.level-停止,.level-整机停机,.level-样本停机,.level-紧急停机,.level-S\.停止,.level-E\.停止{background:#fce8e6;color:var(--stop)}
.card .name{font-size:16px;font-weight:700;color:var(--text);flex:1;min-width:180px}
.card .row{display:grid;grid-template-columns:80px 1fr;gap:6px;margin-top:6px;font-size:13px}
.card .row .lbl{color:var(--sub);font-weight:600}.card .row .val{color:var(--text);line-height:1.7;white-space:pre-line}
.empty{text-align:center;padding:60px 20px;color:var(--sub);font-size:16px}
.notes{background:#f8f9fa;border-radius:8px;padding:14px;margin-top:14px;font-size:13px;color:var(--sub);line-height:1.8}
.footer{text-align:center;padding:20px;color:var(--sub);font-size:12px}
@media(max-width:600px){.search-row{flex-direction:column}.search-row input,.search-row select,.search-row button{width:100%}.card .row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="header"><h1>🩺 LST008α 报警查询系统</h1></div>
<div class="container">
<div class="tabs">
<button class="tab active" onclick="switchTab('au')">📋 仪器报警</button>
<button class="tab" onclick="switchTab('data')">🔬 数据报警</button>
<button class="tab" onclick="switchTab('retest')">🔄 复查时数据报警</button>
<button class="tab" onclick="switchTab('all')">🔍 全局搜索</button>
</div>
<div id="panel-au" class="panel active">
<div class="search-bar"><div class="search-row">
<div style="min-width:140px"><label>🔢 主代码</label><input type="text" id="au-main-code" placeholder="主代码" oninput="filterAU()"></div>
<div style="min-width:140px"><label>🔣 子代码</label><input type="text" id="au-sub-code" placeholder="子代码" oninput="filterAU()"></div>
<button class="btn-reset" onclick="resetAU()" style="align-self:flex-end">重置</button>
</div></div>
<div class="result-count" id="au-count"></div><div class="results" id="au-results"></div></div>
<div id="panel-data" class="panel">
<div class="search-bar"><div class="search-row">
<div style="min-width:180px"><label>🔬 数据报警</label><select id="data-name" onchange="filterData()"><option value="">全部</option></select></div>
<div style="min-width:140px"><label>📟 代码</label><input type="text" id="data-code" placeholder="例: ADC.E" oninput="filterData()"></div>
<div style="min-width:120px"><label>🧪 单元</label><select id="data-unit" onchange="filterData()"><option value="">全部</option><option value="比色">比色</option><option value="ISE">ISE</option></select></div>
<button class="btn-reset" onclick="resetData()" style="align-self:flex-end">重置</button>
</div></div>
<div class="result-count" id="data-count"></div><div class="results" id="data-results"></div></div>
<div id="panel-retest" class="panel">
<div class="search-bar"><div class="search-row">
<div style="min-width:220px"><label>🔬 复查报警</label><select id="retest-name" onchange="filterRetest()"><option value="">全部</option></select></div>
</div></div>
<div class="result-count" id="retest-count"></div><div class="results" id="retest-results"></div>
<div class="notes" id="retest-notes"></div></div>
<div id="panel-all" class="panel">
<div class="search-bar"><div class="search-row">
<div style="flex:2"><label>🔍 全局搜索</label><input type="text" id="global-keyword" placeholder="输入关键词..." oninput="filterGlobal()"></div>
<button class="btn-reset" onclick="resetGlobal()" style="align-self:flex-end">清空</button>
</div></div>
<div class="result-count" id="global-count"></div><div class="results" id="global-results"></div></div>
<div class="footer">LST008α 报警查询系统 · 离线可用 · 适配手机/电脑</div>
</div>

function init(){
  var ds=document.getElementById('data-name');
  dataAlarms.forEach(function(d){var o=document.createElement('option');o.value=d[1];o.textContent=d[1]+' - '+d[0];ds.appendChild(o)});
  var rs=document.getElementById('retest-name');
  retestAlarms.forEach(function(r){var o=document.createElement('option');o.value=r[1];o.textContent=r[1]+' - '+r[0];rs.appendChild(o)});
  filterAU();
}
function switchTab(t){
  ['au','data','retest','all'].forEach(function(id){document.getElementById('panel-'+id).classList.toggle('active',id===t)});
  document.querySelectorAll('.tab').forEach(function(tb){tb.classList.toggle('active',tb.textContent.indexOf(t==='au'?'仪器':t==='data'?'数据':t==='retest'?'复查':'全局')>=0)});
}
function filterAU(){
  var mc=document.getElementById('au-main-code').value.trim(),sc=document.getElementById('au-sub-code').value.trim(),f=auAlarms;
  if(mc)f=f.filter(function(a){return String(a[0])===mc});
  if(sc)f=f.filter(function(a){return String(a[1])===sc||(a[4]||'').indexOf(sc)>=0||(a[6]||'').indexOf(sc)>=0});
  renderAUCards(f);
}
function renderAUCards(alarms){
  var h='';
  alarms.forEach(function(a){
    var lc=a[2],cls='';
    if(lc==='停止'||lc==='S.停止'||lc==='E.停止'||lc==='整机停机'||lc==='样本停机'||lc==='紧急停机')cls=' stop';
    else if(lc==='警告')cls=' warn';
    h+='<div class="card'+cls+'"><div class="card-header"><span class="code-badge">'+a[0]+'</span>';
    if(a[1]&&a[1]!=='-')h+='<span class="code-badge sub">'+a[1]+'</span>';
    h+='<span class="level-badge level-'+lc.replace(/\./g,'\\\\.')+'">'+lc+'</span><span class="name">'+a[3]+'</span></div>';
    if(a[4])h+='<div class="row"><span class="lbl">📝 详情</span><span class="val">'+a[4]+'</span></div>';
    if(a[5])h+='<div class="row"><span class="lbl">💊 方案</span><span class="val">'+a[5]+'</span></div>';
    if(a[6])h+='<div class="row"><span class="lbl">🔍 触发</span><span class="val">'+a[6]+'</span></div>';
    h+='</div>'
  });
  document.getElementById('au-results').innerHTML=h||'<div class="empty">📭 未找到匹配的报警</div>';
  document.getElementById('au-count').textContent=alarms.length?'共 '+alarms.length+' 条AU报警':'';
}
function resetAU(){document.getElementById('au-main-code').value='';document.getElementById('au-sub-code').value='';filterAU();}
function filterData(){
  var nm=document.getElementById('data-name').value,cd=document.getElementById('data-code').value.trim().toLowerCase(),un=document.getElementById('data-unit').value,f=dataAlarms;
  if(nm)f=f.filter(function(d){return d[1]===nm});
  if(cd)f=f.filter(function(d){return d[1].toLowerCase().indexOf(cd)>=0});
  if(un)f=f.filter(function(d){return d[2]==='○'&&un==='比色'||d[3]==='○'&&un==='ISE'});
  renderDataCards(f);
}
function renderDataCards(alarms){

    h+='<div class="card"><div class="card-header"><span class="code-badge">'+d[1]+'</span>'+ub+'<span class="name">'+d[0]+'</span></div>';
    h+='<div class="row"><span class="lbl">📝 内容</span><span class="val">'+d[4]+'</span></div>';
    h+='<div class="row"><span class="lbl">⚠️ 原因</span><span class="val">'+d[5]+'</span></div>';

  });
  document.getElementById('data-results').innerHTML=h||'<div class="empty">📭 未找到</div>';
  document.getElementById('data-count').textContent=alarms.length?'共 '+alarms.length+' 条':'';

  });
  document.getElementById('retest-results').innerHTML=h||'<div class="empty">📭 未找到</div>';
  document.getElementById('retest-count').textContent=alarms.length?'共 '+alarms.length+' 条':'';
  document.getElementById('retest-notes').innerHTML='<b>📋 注释</b><br>○：自动复查 ×：手动复查 ○/×：可设定<br>尿液时减量，非尿液同初次量；电解质与初次同量。';
}
function filterGlobal(){
  var kw=document.getElementById('global-keyword').value.trim().toLowerCase();
  if(!kw){document.getElementById('global-results').innerHTML='';document.getElementById('global-count').textContent='';return}
  var results=[];
  auAlarms.forEach(function(a){var t=[a[0],a[1],a[2],a[3],a[4],a[5],a[6]].join(' ').toLowerCase();if(t.indexOf(kw)>=0)results.push({type:'AU',code:a[0]+(a[1]&&a[1]!=='-'?'-'+a[1]:''),name:a[3],data:a})});
  dataAlarms.forEach(function(d){var t=[d[0],d[1],d[4],d[5],d[6]].join(' ').toLowerCase();if(t.indexOf(kw)>=0)results.push({type:'数据',code:d[1],name:d[0],data:d})});
  retestAlarms.forEach(function(r){var t=[r[0],r[1],r[2],r[4]].join(' ').toLowerCase();if(t.indexOf(kw)>=0)results.push({type:'复查',code:r[1],name:r[0],data:r})});
  renderGlobalCards(results);
}
function renderGlobalCards(results){
  var h='';
  results.forEach(function(r){
    h+='<div class="card"><div class="card-header"><span style="font-size:11px;color:var(--primary);font-weight:700">['+r.type+']</span><span class="code-badge">'+r.code+'</span><span class="name">'+r.name+'</span></div>';
    if(r.type==='数据')h+='<div class="row"><span class="lbl">📝</span><span class="val">'+r.data[4]+'</span></div>';
    else if(r.type==='复查')h+='<div class="row"><span class="lbl">📊</span><span class="val">'+r.data[2]+'</span></div>';
    else h+='<div class="row"><span class="lbl">📝</span><span class="val">'+r.data[4]+'</span></div>';
    h+='</div>';
  });
  document.getElementById('global-results').innerHTML=h||'<div class="empty">📭 未找到</div>';
  document.getElementById('global-count').textContent=results.length?'找到 '+results.length+' 条':'';
}
function resetGlobal(){document.getElementById('global-keyword').value='';document.getElementById('global-results').innerHTML='';document.getElementById('global-count').textContent=''}
init();
</script>
